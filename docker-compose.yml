services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-market_news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-market_news}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market_news} -d ${POSTGRES_DB:-market_news}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-market_news}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-market_news}
      DATA_DIR: /app/data
    volumes:
      - botdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  landing:
    image: python:3.12-alpine
    command: python -m http.server 8080 --directory /landing
    volumes:
      - ./landing:/landing:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  botdata:
